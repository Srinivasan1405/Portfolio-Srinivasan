<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #e0f4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .admin-container {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,191,255,0.3);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 8px 32px rgba(0,191,255,0.15);
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #4a5568;
            margin-bottom: 2rem;
            font-weight: 300;
        }
        .login-box {
            max-width: 400px;
            margin: 2rem auto;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid rgba(0,191,255,0.3);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1rem;
            outline: none;
        }
        .login-box input:focus {
            border-color: #00bfff;
            box-shadow: 0 0 15px rgba(0,191,255,0.3);
        }
        .login-btn {
            padding: 14px 45px;
            background: linear-gradient(45deg, #00bfff, #0099cc);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,191,255,0.3); }
        .logout-btn {
            padding: 8px 20px;
            background: transparent;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .logout-btn:hover { background: #e74c3c; color: #fff; }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0,191,255,0.15);
        }
        th {
            color: #00bfff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        td { color: #1a1a2e; font-size: 0.9rem; }
        tr:hover td { background: rgba(0,191,255,0.05); }
        .msg-content { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .no-msg { text-align: center; padding: 3rem; color: #4a5568; }
        .error-msg { color: #e74c3c; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
        .success-msg { color: #2ecc71; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
        .hidden { display: none; }
        .badge {
            display: inline-block;
            background: rgba(0,191,255,0.1);
            color: #00bfff;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .admin-container { padding: 1.5rem; }
            th, td { padding: 8px 10px; font-size: 0.8rem; }
            .msg-content { max-width: 150px; }
            table { font-size: 0.8rem; }
            .header-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="admin-container" id="app">
        <div class="header-row">
            <div>
                <h1><i class="fas fa-envelope"></i> Messages</h1>
                <p class="subtitle">Messages sent from your portfolio</p>
            </div>
            <button class="logout-btn hidden" id="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div class="login-box" id="login-box">
            <p class="error-msg" id="login-error">Incorrect password</p>
            <input type="password" id="password-input" placeholder="Enter admin password" onkeydown="if(event.key==='Enter') login()">
            <button class="login-btn" onclick="login()"><i class="fas fa-lock"></i> Unlock</button>
        </div>

        <div id="messages-area" class="hidden">
            <p style="margin-bottom:1rem;color:#4a5568;"><span class="badge" id="msg-count">0</span> total messages</p>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Message</th><th>Date</th></tr>
                    </thead>
                    <tbody id="messages-tbody">
                        <tr><td colspan="4" class="no-msg">No messages yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const TOKEN_KEY = 'admin_token';

        function isLoggedIn() {
            return sessionStorage.getItem(TOKEN_KEY) === 'true';
        }

        function showLogin() {
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('messages-area').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
        }

        function showMessages() {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('messages-area').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
        }

        async function login() {
            const password = document.getElementById('password-input').value;
            const errorEl = document.getElementById('login-error');
            errorEl.style.display = 'none';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    sessionStorage.setItem(TOKEN_KEY, 'true');
                    sessionStorage.setItem('admin_pw', password);
                    showMessages();
                    loadMessages();
                } else {
                    errorEl.style.display = 'block';
                }
            } catch {
                errorEl.textContent = 'Network error';
                errorEl.style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem('admin_pw');
            showLogin();
        }

        async function loadMessages() {
            try {
                const password = sessionStorage.getItem('admin_pw');
                const res = await fetch('/api/messages', {
                    headers: { 'x-admin-password': password }
                });
                const messages = await res.json();
                const tbody = document.getElementById('messages-tbody');
                document.getElementById('msg-count').textContent = messages.length;

                if (messages.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="no-msg">No messages yet</td></tr>';
                    return;
                }

                if (!res.ok) {
                    throw new Error('Unauthorized');
                }

                tbody.innerHTML = messages.map(m => {
                    const date = new Date(m.createdAt).toLocaleDateString('en-IN', {
                        day: 'numeric', month: 'short', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                    return `<tr>
                        <td><strong>${escapeHtml(m.name)}</strong></td>
                        <td><a href="mailto:${escapeHtml(m.email)}" style="color:#00bfff;text-decoration:none;">${escapeHtml(m.email)}</a></td>
                        <td><div class="msg-content" title="${escapeHtml(m.message)}">${escapeHtml(m.message)}</div></td>
                        <td style="white-space:nowrap;font-size:0.8rem;color:#4a5568;">${date}</td>
                    </tr>`;
                }).join('');
            } catch {
                document.getElementById('messages-tbody').innerHTML = '<tr><td colspan="4" class="no-msg" style="color:#e74c3c;">Failed to load messages</td></tr>';
            }
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        if (isLoggedIn()) {
            showMessages();
            loadMessages();
        }
    </script>
</body>
</html>
